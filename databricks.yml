# Declarative Automation Bundle definition for formula_1.
bundle:
  name: formula_1
  uuid: a77e5ca4-9ec8-46dd-970e-8e396409f4d4

include:
  - resources/*.yml

sync:
  exclude:
    - producer/**

artifacts:
  formula_1_wheel:
    type: whl
    build: uv build --wheel
    path: .

variables:
  catalog:
    description: The catalog to use
  bronze_schema:
    description: Schema of the bronze layer
    default: formula_1_bronze
  silver_schema:
    description: Schema of the silver layer
    default: formula_1_silver
  gold_schema:
    description: Schema of the gold layer
    default: formula_1_gold
  landing_path:
    description: Volume path for raw landing files, shared by the pipeline and the fetch tasks
  secret_scope:
    description: Secret scope with the project secrets
    default: formula-1
  contact_email_key:
    description: Secret key with the contact address for the User-Agent header
    default: formula-1-contact-email
  jolpica_seasons:
    description: Comma-separated seasons to ingest
    default: "2023,2024,2025,2026"
  jolpica_page_limit:
    description: Page size requested from the Jolpica API (the server may cap it)
    default: "100"
  jolpica_min_interval_sec:
    description: Minimum seconds between Jolpica requests
    default: "1.0"
  jolpica_max_requests_per_hour:
    description: Hourly request budget (Jolpica allows 500)
    default: "450"
  openf1_years:
    description: Comma-separated years to ingest from OpenF1
    default: "2023,2024,2025,2026"
  openf1_session_names:
    description: Comma-separated session names to ingest per-session endpoints for
    default: "Race,Sprint"
  openf1_min_interval_sec:
    description: Minimum seconds between OpenF1 requests (free tier allows 30 per minute)
    default: "2.5"
  openf1_max_requests_per_hour:
    description: Hourly request budget for OpenF1
    default: "1400"
  eventhub_namespace:
    description: Event Hubs namespace that receives the OpenF1 replay
  eventhub_name:
    description: Event Hub (topic) that receives the OpenF1 replay
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries
    lookup:
      warehouse: "Serverless Starter Warehouse"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://adb-7405613488297663.3.azuredatabricks.net
    variables:
      catalog: dbr_dev_ua5816bd
      landing_path: /Volumes/dbr_dev_ua5816bd/formula_1_bronze/raw
      eventhub_namespace: evhua5816bd
      eventhub_name: danylo-ev-hub

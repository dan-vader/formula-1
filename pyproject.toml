[project]
name = "formula_1"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31,<3",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
producer = [
    "azure-eventhub>=5.11,<6",
    "azure-identity>=1.15,<2",
    "azure-keyvault-secrets>=4.8,<5",
]

[dependency-groups]
dev = [
    "pytest",
    "chispa",
    "ruff",
    "databricks-dlt",
    "databricks-connect>=16.4,<16.5",
    "ipykernel",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/formula_1"]

[tool.ruff]
line-length = 120


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

resources:
  jobs:
    formula_1_ingest:
      name: formula_1_ingest

      parameters:
        - name: landing_path
          default: ${var.landing_path}
        - name: secret_scope
          default: ${var.secret_scope}
        - name: contact_email_key
          default: ${var.contact_email_key}
        - name: seasons
          default: ${var.jolpica_seasons}
        - name: page_limit
          default: ${var.jolpica_page_limit}
        - name: min_interval_sec
          default: ${var.jolpica_min_interval_sec}
        - name: max_requests_per_hour
          default: ${var.jolpica_max_requests_per_hour}

      tasks:
        - task_key: fetch_jolpica
          environment_key: default
          timeout_seconds: 3600
          spark_python_task:
            python_file: ../src/ingestion/fetch_jolpica.py
            parameters:
              - --landing-path
              - "{{job.parameters.landing_path}}"
              - --secret-scope
              - "{{job.parameters.secret_scope}}"
              - --contact-email-key
              - "{{job.parameters.contact_email_key}}"
              - --seasons
              - "{{job.parameters.seasons}}"
              - --page-limit
              - "{{job.parameters.page_limit}}"
              - --min-interval-sec
              - "{{job.parameters.min_interval_sec}}"
              - --max-requests-per-hour
              - "{{job.parameters.max_requests_per_hour}}"
        - task_key: refresh_bronze
          depends_on:
            - task_key: fetch_jolpica
          pipeline_task:
            pipeline_id: ${resources.pipelines.formula_1_bronze.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

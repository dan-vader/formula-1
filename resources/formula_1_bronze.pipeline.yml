resources:
  pipelines:
    formula_1_bronze:
      name: formula_1_bronze
      catalog: ${var.catalog}
      schema: ${var.bronze_schema}
      serverless: true
      root_path: "../src/formula_1_bronze"

      libraries:
        - glob:
            include: ../src/formula_1_bronze/transformations/**

      environment:
        dependencies:
          - ../dist/*.whl

      configuration:
        formula_1.landing_path: ${var.landing_path}
        formula_1.reference_path: ${workspace.file_path}/data/reference
        formula_1.secret_scope: ${var.secret_scope}
        formula_1.eventhub_namespace: ${var.eventhub_namespace}
        formula_1.eventhub_name: ${var.eventhub_name}
